name: WebAi V0.1 CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check server/index.mjs
          node --check server/core.mjs
          node --check server/agent.mjs
          node --check server/native-worker.mjs
          node --check server/snapshot-store.mjs
          node --check app.js
          node --check app-core.js
          node --check capability-bridge.js
          node --check native-core-ui.js
          node --check core-bridge.js
          node --check scripts/smoke.mjs
          node --check scripts/core-smoke.mjs
          node --check scripts/agent-smoke.mjs
          node --check scripts/native-worker-smoke.mjs
          node --check scripts/snapshot-smoke.mjs
      - name: Secret proxy contract
        run: |
          grep -q 'webai-typhoon-proxy' server/index.mjs
          grep -q 'TYPHOON_API_KEY' server/index.mjs
          grep -q '/api/typhoon/chat' server/index.mjs
          ! grep -q 'WEBAI_WORKSPACE' server/index.mjs
          ! grep -q 'createAgentService' server/index.mjs
          ! grep -q 'node:child_process' server/index.mjs
          ! grep -q '/api/tasks' server/index.mjs
          ! grep -q 'nativeWorker' server/index.mjs
          ! grep -q 'snapshot' server/index.mjs
          ! grep -q 'AGENT_STATE' server/index.mjs
      - name: WebAi Core contract
        run: |
          grep -q 'webai-core' server/core.mjs
          grep -q 'TYPHOON_PROXY_BASE_URL' server/core.mjs
          grep -q 'WEBAI_CORE_PAIRING_TOKEN' server/core.mjs
          grep -q 'WEBAI_CORE_SESSION_SECRET' server/core.mjs
          grep -q 'x-webai-session' server/core.mjs
          grep -q 'ownerStatePath' server/core.mjs
          grep -q 'createAgentService' server/core.mjs
          ! grep -q 'TYPHOON_API_KEY' server/core.mjs
          grep -q 'webai-native-v0.1' server/native-worker.mjs
          grep -q 'native_path_denied' server/native-worker.mjs
          grep -q 'native_symlink_denied' server/native-worker.mjs
      - name: Snapshot foundation contract
        run: |
          grep -q 'createSnapshotStore' server/snapshot-store.mjs
          grep -q 'rollback_conflict' server/snapshot-store.mjs
          grep -q 'beforeSha256' server/snapshot-store.mjs
          grep -q 'afterSha256' server/snapshot-store.mjs
          grep -q 'snapshot_store_inside_workspace' server/snapshot-store.mjs
          ! grep -q 'TYPHOON_API_KEY' server/snapshot-store.mjs
      - name: Frontend split contract
        run: |
          grep -q 'executionTarget = "webai-native"' app.js
          grep -q 'native-core-ui.js' app.js
          grep -q 'core-bridge.js' app.js
          grep -q 'webai.coreBase' core-bridge.js
          grep -q 'x-webai-session' core-bridge.js
          ! grep -qi 'browserpod' app.js
          ! grep -qi 'browser-linux' app.js
      - name: Test suite
        run: npm test
