name: WebAi V0.1 CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check server/index.mjs
          node --check app.js
          node --check app-core.js
          node --check capability-bridge.js
          node --check browserpod-storage-lock-fix.js
          node --check browser-linux-worker-v03.js
          node --check coi-sw.js
      - name: Browser worker contract
        run: |
          grep -q 'executionTarget = "browser"' app.js
          grep -q 'browserpod-storage-lock-fix.js' app.js
          grep -q 'browser-linux-worker-v03.js' app.js
          grep -q 'minimalMode: true' browser-linux-worker-v03.js
          grep -q 'พร้อม Clone / Sync WebAi' browser-linux-worker-v03.js
          grep -q 'ensureCommandTerminal' browser-linux-worker-v03.js
          grep -q 'state.operation' browser-linux-worker-v03.js
          grep -q 'command -v git' browser-linux-worker-v03.js
          grep -q 'createDefaultTerminal' browser-linux-worker-v03.js
          ! grep -q 'runPreflight' browser-linux-worker-v03.js
          ! grep -q 'browser-linux-worker.js' app.js
          ! grep -q 'browser-linux-operation-guard.js' app.js
          ! grep -q 'browser-linux-running-ui-fix.js' app.js
          ! grep -q 'browser-linux-hotfix.js' app.js
          grep -q 'Cross-Origin-Embedder-Policy' coi-sw.js
      - name: API smoke test
        run: npm run smoke
