name: WebAi V0.1 CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check server/index.mjs
          node --check server/core.mjs
          node --check server/core-recovery.mjs
          node --check server/agent.mjs
          node --check server/native-worker.mjs
          node --check server/snapshot-store.mjs
          node --check server/diff-evidence.mjs
          node --check server/verification-engine.mjs
          node --check browser-memory-client.js
          node --check app.js
          node --check app-core.js
          node --check workspace.js
          node --check capability-bridge.js
          node --check core-bridge.js
          node --check core-execute.js
          node --check diff-evidence.js
          node --check verification-evidence.js
          node --check scripts/smoke.mjs
          node --check scripts/browser-memory-smoke.mjs
          node --check scripts/core-smoke.mjs
          node --check scripts/agent-smoke.mjs
          node --check scripts/native-worker-smoke.mjs
          node --check scripts/diff-evidence-smoke.mjs
          node --check scripts/verification-engine-smoke.mjs
          node --check scripts/verification-state-smoke.mjs
          node --check scripts/snapshot-smoke.mjs
          node --check scripts/recovery-smoke.mjs
      - name: Secret proxy contract
        run: |
          grep -q 'webai-typhoon-proxy' server/index.mjs
          grep -q 'TYPHOON_API_KEY' server/index.mjs
          grep -q '/api/typhoon/chat' server/index.mjs
          ! grep -q 'WEBAI_WORKSPACE' server/index.mjs
          ! grep -q 'createAgentService' server/index.mjs
          ! grep -q 'node:child_process' server/index.mjs
          ! grep -q '/api/tasks' server/index.mjs
          ! grep -q 'nativeWorker' server/index.mjs
          ! grep -q 'snapshot' server/index.mjs
      - name: Core transaction contract
        run: |
          grep -q 'webai-core' server/core.mjs
          grep -q 'TYPHOON_PROXY_BASE_URL' server/core.mjs
          ! grep -q 'TYPHOON_API_KEY' server/core.mjs
          grep -q 'createSnapshotStore' server/core.mjs
          grep -q 'WEBAI_CORE_SNAPSHOT_DIR' server/core.mjs
          grep -q 'withWorkspaceLock' server/core.mjs
          grep -q 'service.rollback' server/core.mjs
          grep -q 'snapshotStore' server/agent.mjs
          grep -q 'snapshot_captured' server/agent.mjs
          grep -q 'rollback_completed' server/agent.mjs
          grep -q 'completed_task_not_rollbackable' server/agent.mjs
      - name: Recovery and Diff evidence contract
        run: |
          grep -q 'recoverOwnerState' server/core.mjs
          grep -q 'execution_recovered_applied' server/core-recovery.mjs
          grep -q 'execution_recovery_conflict' server/core-recovery.mjs
          grep -q 'diffExact' server/core-recovery.mjs
          grep -q 'createDiffEvidence' server/diff-evidence.mjs
          grep -q 'MAX_MYERS_WORK' server/diff-evidence.mjs
          grep -q 'bounded-replacement' server/diff-evidence.mjs
          grep -q 'createDiffEvidence' server/snapshot-store.mjs
          grep -q 'beforeSha256' server/snapshot-store.mjs
          grep -q 'afterSha256' server/snapshot-store.mjs
          grep -q 'additions' server/snapshot-store.mjs
          grep -q 'deletions' server/snapshot-store.mjs
          grep -q 'diffKind' server/agent.mjs
          ! grep -q 'TYPHOON_API_KEY' server/diff-evidence.mjs
      - name: Multi-gate verification contract
        run: |
          grep -q 'createVerificationEngine' server/core.mjs
          grep -q 'multi-gate-v0.5' server/core.mjs
          grep -q 'VERIFICATION_GATE_ORDER' server/core.mjs
          ! grep -q 'function runVerification' server/core.mjs
          ! grep -q 'npm test' server/core.mjs
          grep -q 'file_safety' server/verification-engine.mjs
          grep -q 'security' server/verification-engine.mjs
          grep -q 'build' server/verification-engine.mjs
          grep -q 'unit' server/verification-engine.mjs
          grep -q 'integration' server/verification-engine.mjs
          grep -q 'regression' server/verification-engine.mjs
          grep -q 'verification_command_source_changed' server/verification-engine.mjs
          grep -q 'security_findings' server/verification-engine.mjs
          grep -q 'outputSha256' server/verification-engine.mjs
          ! grep -q 'TYPHOON_API_KEY' server/verification-engine.mjs
          grep -q 'normalizeVerificationGates' server/agent.mjs
          grep -q 'passedRequired' server/agent.mjs
          grep -q 'raw gate output must not enter task state' scripts/verification-state-smoke.mjs
      - name: Browser Agent and Memory primary contract
        run: |
          grep -q 'executionTarget = "browser-agent"' app.js
          grep -q 'browser-memory-client.js' app.js
          grep -q 'requestBrowserAgentChat' app-core.js
          grep -q '/api/typhoon/chat' app-core.js
          grep -q 'localOnly: true' app-core.js
          grep -q 'sandbox preview' app-core.js
          grep -q 'indexedDB' workspace.js
          grep -q 'workspace.js' index.html
          ! grep -qi 'browserpod' app.js
          ! grep -qi 'browser-linux' app.js
      - name: Optional Core Execute, Diff and Verification UI contract
        run: |
          grep -q 'core-bridge.js' app.js
          grep -q 'core-execute.js' app.js
          grep -q 'diff-evidence.js' app.js
          grep -q 'verification-evidence.js' app.js
          grep -q 'webai.coreBase' core-bridge.js
          grep -q 'x-webai-session' core-bridge.js
          grep -q 'Core Execute' core-execute.js
          grep -q 'webai.coreActiveTask' core-execute.js
          grep -q 'webai.browserAgentTask' core-execute.js
          grep -q '/api/tasks' core-execute.js
          grep -q '/rollback' core-execute.js
          grep -q 'diffEvidenceList' diff-evidence.js
          grep -q 'BEFORE SHA-256' diff-evidence.js
          grep -q 'AFTER SHA-256' diff-evidence.js
          grep -q 'MULTI-GATE VERIFICATION' verification-evidence.js
          grep -q 'OUTPUT SHA-256' verification-evidence.js
          ! grep -q 'innerHTML' diff-evidence.js
          ! grep -q 'innerHTML' verification-evidence.js
      - name: Test suite
        run: npm test
