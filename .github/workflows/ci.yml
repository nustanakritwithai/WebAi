name: WebAi V0.1 CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check server/index.mjs
          node --check app.js
          node --check app-core.js
          node --check capability-bridge.js
          node --check browserpod-storage-lock-fix.js
          node --check browser-linux-worker.js
          node --check browser-linux-hotfix.js
          node --check browser-linux-running-ui-fix.js
          node --check browser-linux-operation-guard.js
          node --check coi-sw.js
      - name: Browser worker contract
        run: |
          grep -q 'executionTarget = "browser"' app.js
          grep -q 'browserpod-storage-lock-fix.js' app.js
          grep -q 'browser-linux-running-ui-fix.js' app.js
          grep -q 'browser-linux-operation-guard.js' app.js
          grep -q 'WebAiBrowserPodPatchReady' app.js
          grep -q 'device already opened in another tab' browserpod-storage-lock-fix.js
          grep -q 'storageKey' browserpod-storage-lock-fix.js
          grep -q 'BrowserPod.boot' browser-linux-worker.js
          grep -q 'webai.browserpod.autoboot' browser-linux-hotfix.js
          grep -q 'stopImmediatePropagation' browser-linux-hotfix.js
          grep -q 'Linux Running' browser-linux-running-ui-fix.js
          grep -q 'preflight_timeout' browser-linux-running-ui-fix.js
          grep -q 'Clone / Sync' browser-linux-operation-guard.js
          grep -q 'shellOpen' browser-linux-operation-guard.js
          grep -q 'operation_timeout' browser-linux-operation-guard.js
          grep -q 'Cross-Origin-Embedder-Policy' coi-sw.js
          grep -q 'Browser Linux Worker' browser-linux-worker.js
      - name: API smoke test
        run: npm run smoke
