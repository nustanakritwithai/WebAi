# Dedicated HTTPS listener for WebAi Core. It is separate from the OpenTyphoon proxy on :5444.
Listen 5445

<VirtualHost *:5445>
    ServerName 157.85.96.139
    ErrorLog "C:/xampp/apache/logs/webai-core-error.log"
    CustomLog "C:/xampp/apache/logs/webai-core-access.log" common

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile "C:/ProgramData/MonsterLife/acme/production/certificates/157.85.96.139.crt"
    SSLCertificateKeyFile "C:/ProgramData/MonsterLife/acme/production/certificates/157.85.96.139.key"
    Header always set Strict-Transport-Security "max-age=31536000"

    ProxyRequests Off
    ProxyPreserveHost Off
    ProxyAddHeaders On
    ProxyPass "/api/" "http://127.0.0.1:8790/api/" retry=0 timeout=190
    ProxyPassReverse "/api/" "http://127.0.0.1:8790/api/"

    <Location "/api/">
        Require all granted
    </Location>
</VirtualHost>
