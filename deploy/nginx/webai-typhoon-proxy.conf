# Replace YOUR_VPS_HOST with the public DNS name before enabling this site.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_VPS_HOST;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_VPS_HOST;

    ssl_certificate /etc/letsencrypt/live/YOUR_VPS_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_VPS_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64k;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 70s;
    }
}
