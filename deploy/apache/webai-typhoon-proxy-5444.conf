# Dedicated HTTPS listener for WebAi. Keep this separate from Monster Life's :443 routes.
Listen 5444

<VirtualHost *:5444>
    ServerName 157.85.96.139
    ErrorLog "C:/xampp/apache/logs/webai-typhoon-proxy-error.log"
    CustomLog "C:/xampp/apache/logs/webai-typhoon-proxy-access.log" common

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile "C:/ProgramData/MonsterLife/acme/production/certificates/157.85.96.139.crt"
    SSLCertificateKeyFile "C:/ProgramData/MonsterLife/acme/production/certificates/157.85.96.139.key"
    Header always set Strict-Transport-Security "max-age=31536000"

    ProxyRequests Off
    ProxyPreserveHost Off
    ProxyAddHeaders On
    ProxyPass "/api/" "http://127.0.0.1:8787/api/" retry=0 timeout=70
    ProxyPassReverse "/api/" "http://127.0.0.1:8787/api/"

    <Location "/api/">
        Require all granted
    </Location>
</VirtualHost>
